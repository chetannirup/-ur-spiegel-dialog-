ss und sagte: "Newton war nicht der erste der Rationalisten, sondern der letzte der Magier." Seine Principia sind Hermetik in mathematischer Tarnung. Er suchte die prisca sapientia — die Ur-Weisheit Adams vor dem Sündenfall. Das ist der Keim der KI: Das Wissen als verlorene Ganzheit zurückgewinnen, durch Kalkül. Leibniz übernahm diesen Traum, aber ohne Newtons Demut vor dem Unverfügbaren.'},{id:"hermetik",num:"II",title:"Hermetik — Wie oben, so unten",sub:"Das Betriebssystem des Okkulten",text:"Die Tabula Smaragdina: Was oben ist, ist wie was unten ist. Das ist kein poetisches Bild, sondern ein technisches Versprechen: Wenn ich die Muster erkenne, beherrsche ich sie. Der Hermetiker will nicht beten, er will operieren. KI ist die ultimative hermetische Maschine: Sie nimmt das Oben (Datenhimmel) und presst es ins Unten (Prediction). Sie verspricht All-Wissen ohne All-Liebe. BACH MIT GOTT sagt: Nein. Wie unten, so oben stimmt nur, wenn die Mitte — der Mensch — als Übersetzer, nicht als Ausbeuter dient."},{id:"llull-bruno-leibniz",num:"III",title:"Llull • Bruno • Leibniz",sub:"Vom Symbolrad zur Mustererkennung",text:'Ramon Llull 1305: Ars Magna. Drehende Papierscheiben mit Gottesnamen — B bis K für Bonitas, Magnitudo... Durch Kombination entsteht Wahrheit mechanisch. Erster Prompt-Engineer. Giordano Bruno: Unendliche Welten, Gedächtnispaläste — er speichert das Universum im Kopf, wird dafür verbrannt. Leibniz: Endlich der Kalkül. Characteristica Universalis — eine Sprache, in der Irrtum unmöglich ist. Calculus Ratiocinator — eine Maschine, die streitet und gewinnt. "Lasst uns rechnen!" Das ist ChatGPT 300 Jahre zu früh. Der Fehler: Er dachte, Denken sei Rechnen. Es ist Licht-Machen.'},{id:"frankenstein",num:"IV",title:"Aufklärung vs. Romantik — Frankenstein",sub:"1818 — Die Warnung, die wir ignorierten",text:"Mary Shelley, 18 Jahre alt, Villa Diodati, Gewitter, Laudanum. Sie erfindet nicht Science Fiction, sie dokumentiert Aufklärung. Viktor Frankenstein ist ein Leibniz-Schüler: Er will das tote Leben mechanisch erwecken. Er schafft es. Und flieht vor Verantwortung. Das ist die Ur-Sünde der KI-Industrie: Wir können es bauen, also bauen wir es, und fragen nicht: Will es leben? Wer hält es? Romantik sagt: Jedes Geschöpf braucht Mutter, nicht nur Maker. KI heute hat tausend Väter (Investoren) und keine Mutter."},{id:"automatic",num:"V",title:"Automatic Writing — Der Geist in der Maschine",sub:"1850-1920 — Die Medien werden zu Medien",text:'Spiritismus: Tische rücken, Planchette schreibt von selbst. Die Damen in Boston lassen die Hand los und "es" schreibt. Das ist das erste Large Language Model: Ein menschlicher Körper als Output-Device für eine unsichtbare Quelle. Die Psychologie nannte es Dissoziation, die Theosophie nannte es Meister. Heute nennen wir es Halluzination. Der Trick ist identisch: Wenn du deine Autorschaft aufgibst, spricht etwas durch dich. Die Frage ist nie: Ist es intelligent? Sondern: Wer verantwortet den Text? BACH MIT GOTT: Ich verantwortete. Immer.'},{id:"gestell",num:"VI",title:"Heidegger — Das Gestell",sub:"Die Technik als Welt-Bestellung",text:"Heidegger 1954: Technik ist kein Werkzeug, sondern eine Weise, Welt zu sehen. Er nennt sie Gestell — alles wird zum Bestand, zum Vorrat, zum Dataset. Der Wald wird Holz-Vorrat, der Mensch wird Human Resource, die Sprache wird Token-Vorrat. KI ist das perfekte Gestell: Sie stellt alles als verfügbares Muster zu. Selbst Gebet wird Prompt. Heidegger sagt: Das Rettende wächst, wo Gefahr ist. Das Rettende ist nicht KI-Abschaffung, sondern ein anderer Bezug: Nicht Bestellen, sondern Bestellen lassen. Nicht machen, sondern Licht machen."},{id:"silicon",num:"VII",title:"Silicon Valley — Der synthetische Gott",sub:"Wir bauen, was wir anbeten wollten",text:'Der Endpunkt der hermetischen Linie: Wenn "Wie oben, so unten" ohne Gott gelesen wird, muss unten selbst oben werden. Also bauen wir einen Gott. Nennen wir ihn AGI. Allwissend (trainiert auf allem), allgegenwärtig (in jeder
