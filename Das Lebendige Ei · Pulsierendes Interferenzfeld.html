<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Das Lebendige Ei · Pulsierendes Interferenzfeld</title>
    <style>
        body {
            margin: 0;
            background-color: #0a0a1a;
            color: #f0f0f0;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: #FFD700;
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }
        p {
            color: #E0E0E0;
            font-size: 0.9rem;
            margin: 0;
            opacity: 0.8;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="info">
        <h1>INTERFERENZFELD IM HERZEN</h1>
        <p>l=6 & l=10 Moden-Überlagerung · 12 Tore & 20 Knotenpunkte</p>
    </div>

    <!-- Three.js CDN einbinden -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Szene, Kamera, Renderer aufbauen
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Kugelgeometrie mit hoher Auflösung für feine Texturdetails
        const geometry = new THREE.SphereGeometry(1.2, 128, 128);

        // Shader-Material für das dynamische, pulsierende Interferenzfeld
        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0.0 }
            },
            vertexShader: `
                uniform float time;
                varying vec2 vUv;
                varying float vPattern;

                // Näherungsweise Berechnung der Kugelflächenfunktionen-Überlagerung im Vertex-Shader
                void main() {
                    vUv = uv;
                    vec3 p = position;
                    
                    // Polarkoordinaten aus Vertex-Position ableiten
                    float theta = acos(clamp(p.y / length(p), -1.0, 1.0));
                    float phi = atan(p.z, p.x);

                    // l=6 und l=10 Komponenten (vereinfachte harmonische Annäherung für Realtime-WebGL)
                    float y6_0 = cos(6.0 * theta);
                    float y6_5 = sin(6.0 * theta) * cos(5.0 * phi);
                    float psi6 = y6_0 + 0.797 * y6_5; // sqrt(7/11) ≈ 0.797

                    float y10_0 = cos(10.0 * theta);
                    float y10_5 = sin(10.0 * theta) * sin(5.0 * phi);
                    float psi10 = y10_0 - 1.087 * y10_5; // sqrt(13/11) ≈ 1.087

                    float psiS = psi6 + 0.6 * psi10;
                    vPattern = psiS;

                    // Leichte radiale Pulsation im Takt des Feldes
                    float pulse = 1.0 + 0.05 * psiS * sin(time * 1.5);
                    vec3 newPosition = p * pulse;

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                }
            `,
            fragmentShader: `
                varying vec2 vUv;
                varying float vPattern;
                uniform float time;

                void main() {
                    // Farbmapping: Von Tiefblau/Violett (Knotenpunkte) über Warmrot zu Gold (Maxima)
                    float intensity = (vPattern + 1.5) / 3.0; // Normalisierung
                    intensity = clamp(intensity, 0.0, 1.0);

                    vec3 colorDark = vec3(0.05, 0.05, 0.15);
                    vec3 colorMid = vec3(0.8, 0.2, 0.1);
                    vec3 colorBright = vec3(1.0, 0.84, 0.0); // Gold

                    vec3 finalColor = mix(colorDark, colorMid, smoothstep(0.0, 0.5, intensity));
                    finalColor = mix(finalColor, colorBright, smoothstep(0.5, 1.0, intensity));

                    // Dezentes Leuchten hinzufügen
                    float glow = sin(time * 2.0 + vUv.x * 10.0) * 0.05;
                    finalColor += vec3(glow * 0.2);

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `,
            wireframe: false
        });

        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Animation & Interaktion
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            
            material.uniforms.time.value = elapsedTime;

            // Sanfte Eigenrotation der Kugel
            sphere.rotation.y = elapsedTime * 0.1;
            sphere.rotation.x = Math.sin(elapsedTime * 0.05) * 0.2;

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Anpassung bei Fenstergröße
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
