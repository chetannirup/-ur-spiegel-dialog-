        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Montserrat:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;1,400&display=swap');
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin:0; }
        .skuki-root {
          min-height: 100vh;
          background: #070a12;
          color: #e8ddd0;
          font-family: 'Montserrat', sans-serif;
          -webkit-font-smoothing: antialiased;
        }
        .skuki-bg {
          position: fixed;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(ellipse at 50% -10%, #1a2a4a 0%, #0f1526 35%, #070a12 70%);
          z-index: 0;
        }
        .skuki-glow {
          position: fixed;
          top: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 100%;
          max-width: 1400px;
          height: 800px;
          background: radial-gradient(ellipse at center, rgba(212,164,86,0.08) 0%, transparent 60%);
          pointer-events: none;
          z-index: 0;
        }
        .skuki-wrap {
          position: relative;
          z-index: 1;
          width: 100%;
          max-width: 980px;
          margin: 0 auto;
          padding: 0 24px;
        }
        @media(min-width:768px){ .skuki-wrap{ padding:0 40px; } }
        a { color: inherit; text-decoration: none; }
        .topbar {
          padding-top: 64px;
          display: flex;
          justify-content: space-between;
          gap: 16px;
          font-family: 'Cinzel', serif;
          font-size: 10px;
          letter-spacing: 0.35em;
          text-transform: uppercase;
          color: rgba(212,164,86,0.7);
        }
        .topbar-right { display:none; color: rgba(138,127,114,0.5); font-family:'Montserrat',sans-serif; letter-spacing:0.2em; }
        @media(min-width:768px){ .topbar-right{display:block;} }
        .badge {
          display:inline-flex;
          align-items:center;
          gap:10px;
          border:1px solid rgba(212,164,86,0.2);
          border-radius:999px;
          padding:6px 16px;
          background: rgba(212,164,86,0.06);
          margin-top:48px;
          margin-bottom:40px;
        }
        .badge-dot { width:6px; height:6px; border-radius:50%; background:#d4a456; }
        .badge-text { font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.28em; color:#d4a456; text-transform:uppercase; }
        h1.skuki-title {
          font-family:'Cinzel',serif;
          font-weight:900;
          font-size: 18vw;
          line-height:0.85;
          letter-spacing:-0.04em;
          margin:0;
          background: linear-gradient(to bottom, #f5e6c8, #d4a456 55%, #8a5a2b);
          -webkit-background-clip:text;
          background-clip:text;
          color: transparent;
          max-width:100%;
          word-break: break-word;
        }
        @media(min-width:768px){ h1.skuki-title{ font-size:110px; } }
        @media(min-width:1024px){ h1.skuki-title{ font-size:132px; } }
        .gold-line {
          margin-top:24px;
          height:1px;
          width:100%;
          background: linear-gradient(to right, rgba(212,164,86,0.6), rgba(212,164,86,0.1), transparent);
        }
        .header-grid {
          margin-top:32px;
          display:grid;
          gap:32px;
        }
        @media(min-width:768px){ .header-grid{ grid-template-columns:1.2fr 0.8fr; gap:48px; } }
        .header-h2 {
          font-family:'Cinzel',serif;
          font-size:22px;
          line-height:1.25;
          color:#f0e2c8;
          margin:0;
          font-weight:400;
        }
        @media(min-width:768px){ .header-h2{ font-size:26px; } }
        .header-sub {
          margin-top:20px;
          font-family:'Cormorant Garamond',serif;
          font-style:italic;
          font-size:19px;
          line-height:1.6;
          color:#c9b8a0;
        }
        .quote-box {
          border-left:1px solid rgba(212,164,86,0.2);
          padding-left:24px;
          padding-top:8px;
          padding-bottom:8px;
        }
        .quote-text {
          font-family:'Cormorant Garamond',serif;
          font-style:italic;
          font-size:20px;
          line-height:1.4;
          color:#d4a456;
          margin:0;
        }
        .quote-author {
          margin-top:12px;
          font-size:11px;
          letter-spacing:0.18em;
          text-transform:uppercase;
          color:#8a7f72;
        }
        .quote-note {
          margin-top:24px;
          font-size:13px;
          line-height:1.7;
          color:#9a8c7d;
        }
        .quote-note span { color:#d4a456; }
        .hero {
          margin-top:56px;
          position:relative;
          border-radius:2px;
          overflow:hidden;
          border:1px solid rgba(212,164,86,0.2);
          background:#0e111c;
        }
        .hero img {
          width:100%;
          aspect-ratio:16/9;
          object-fit:cover;
          display:block;
        }
        @media(min-width:768px){ .hero img{ aspect-ratio:2.1/1; } }
        .hero::after {
          content:'';
          position:absolute;
          inset:0;
          background: linear-gradient(to top, #070a12 0%, transparent 60%);
          opacity:0.8;
          pointer-events:none;
        }
        .hero-caption {
          position:absolute;
          bottom:0;
          left:0;
          right:0;

          display:flex;
          justify-content:space-between;
          padding:20px 24px;
        }
        .hero-caption span {
          font-family:'Cinzel',serif;
          font-size:10px;
          letter-spacing:0.3em;
          text-transform:uppercase;
          color:rgba(212,164,86,0.8);
        }
        .hero-caption .small {
          display:none;
          font-family:'Montserrat',sans-serif;
          letter-spacing:0;
          color:rgba(138,127,114,0.7);
          font-size:11px;
          text-transform:none;
        }
        @media(min-width:768px){ .hero-caption .small{display:block;} }
