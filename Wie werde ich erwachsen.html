 lebt, ist nicht Abweichung, sondern Zukunftszelle.",ubung:"Übung: 3 Imaginalzellen in deiner Stadt finden – Menschen, Orte, Projekte, die schon anders leben. Kontakt aufnehmen. Kein Interview, sondern Resonanz.",color:"#7A8FA8"},{n:"03",title:"Auflösung aushalten",element:"Wasser",subtitle:"Auflösung · Reinigung · Fließen",text:"Im Kokon wird die Raupe zur Ursuppe. Das ist kein Fehler, das ist Metamorphose. Identität löst sich, damit Neues entstehen kann. Wer diesen Zustand nicht halten kann, fällt zurück in alte Form. Bildung muss diesen Zwischenraum halten können.",ubung:"Übung: 48h Digital-Kokon – kein Input, kein Output, kein Optimieren. Nur da sein. Was will sich lösen? Protokoll ohne Bewertung.",color:"#5A7D8A"},{n:"04",title:"Transzendieren & Integrieren",element:"Feuer",subtitle:"Verwandlung · Klarheit",text:"Altes wird nicht vernichtet, sondern aufgehoben – im dreifachen Sinne: bewahrt, angehoben, beendet. Biografie neu weben: Mach alles neu ohne zu zerstören. Erwachsenwerden ist kein Bruch, sondern Integration auf nächster Ebene.",ubung:"Übung: Biografie neu weben – Ein Kapitel deines Lebens aus der Perspektive deines zukünftigen Ichs erzählen, das nichts zerstören musste.",color:"#B95B3A"},{n:"05",title:"Herz wiegen",element:"Wasser + Erde",subtitle:"Feder · Maat · leicht wie eine Feder",text:"Ägyptische Prüfung: Ist dein Herz leichter als die Feder der Maat? Schwere Herzen kommen nicht durch. Nicht weil sie böse sind, sondern weil sie zu viel tragen, was nicht ihres ist. Mündigkeit heißt: nur tragen, was du tragen willst.",ubung:"Übung: Abends Wiegen – Was hat heute leicht gemacht? Was schwer? 3 Sätze. Keine Analyse, nur Wiegen.",color:"#9CAF7D"},{n:"06",title:"Schärfstes Schwert führen",element:"Feuer + Luft",subtitle:"Macht ≠ Grausamkeit",text:"Macht wird oft mit Grausamkeit verwechselt, weil nur Grausame sie offen zeigen. Das schärfste Schwert schneidet, ohne zu verletzen: Es ändert die Bedingungen, unter denen Menschen einander die Hände binden. Gewinner-ohne-Verlierer Verhandlung.",ubung:"Übung: Eine Regel in deinem Umfeld so ändern, dass alle gewinnen. Dokumentieren: Wer hat vorher verloren? Wer gewinnt jetzt? Was kostet es wirklich?",color:"#C79A3B"},{n:"07",title:"Im Leben lieben",element:"Alle Vier",subtitle:"Erde Wasser Feuer Luft",text:"Die Göttliche will hier lieben – nicht im Jenseits, nicht später, nicht wenn alles perfekt ist. Mündigkeit ohne Liebe wird kalt. Liebe ohne Mündigkeit wird abhängig. Erwachsen ist, wer hier lieben kann, mitten in der Unvollkommenheit.",ubung:"Übung: Beifahrersitz – Dem Göttlichen für einen Tag den Knüppel übergeben. Nicht du fährst, du schaust. Wohin will Es?",color:"#D8B4A0"},{n:"08",title:"Achte Säule: Emergenz",element:"—",subtitle:"Entsteht erst durch Metamorphose · nicht lehrbar, nur spürbar",text:"Die achte Säule kann nicht gelehrt werden. Sie entsteht, wenn die sieben anderen gelebt werden. Viele Milliarden Gesichter sind möglich – dein Gesicht. Die Demokratisierung der Mysterien: Jeder Mensch als lebender Horus. Nicht Pharao als einziger Gott, sondern jeder als Gesicht des Göttlichen.",ubung:"Kein Arbeitsauftrag. Nur Hinweis: Wenn du es spürst, weißt du es. Wenn nicht, arbeite weiter an 1-7.",color:"#1A181F",dark:!0}],mf=[{element:"Erde",aufgabe:"Form · Halt · Hülle · Boden",frage:"Was hält? Was schützt?",kompetenz:"Selbstachtung statt Selbstangriff"},{element:"Wasser",aufgabe:"Auflösung · Reinigung · Fließen",frage:"Was darf sich lösen?",kompetenz:"Ambiguitätstoleranz"},{element:"Feuer",aufgabe:"Verwandlung · Klarheit · Schärfe",frage:"Was will verwandelt werden?",kompetenz:"Entscheidungsfähigkeit"},{element:"Luft",aufgabe:"Weite · Atem · Möglichkeit",frage:"Was wird möglich?",kompetenz:"Vorstellungsvermögen"}],zf=[{id:"A",title:"Regeln begründen",desc:"Kann der/die Schüler:in eine bestehende Regel mit eigenen Worten begründen – nicht nur zitieren? Kann er/sie Folgen benennen für Betroffene?",kriterien:["Benennt Schutzgut","Benennt Betroffene","Benennt Kosten"]}
