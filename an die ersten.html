:root{
  --papyrus: #f6e8c8;
  --papyrus-deep: #e8d5a8;
  --papyrus-shadow: #c9ab7a;
  --papyrus-burn: #5a3a1e;
  --ink: #2b1d0e;
  --ink-soft: #4a3722;
  --gold: #c89b2e;
  --gold-bright: #f8d56a;
  --gold-dark: #8c6510;
  --wood: #3b2614;
  --wood-light: #5a3d22;
  --blood: #7a1a1a;
}

@media (prefers-color-scheme: dark){
  :root{
    --papyrus: #f2e2bd;
    --papyrus-deep: #e0c89a;
    --ink: #21150a;
  }
}

html, body {
  margin:0;
  padding:0;
  background: radial-gradient(120% 120% at 50% 0%, #2a1c0f 0%, #1a120b 45%, #0e0905 100%);
  color: var(--ink);
  font-family: "Cormorant Garamond", serif;
  overflow-x-clip: true;
}

* {
  text-wrap: pretty;
}

/* Papyrus fiber texture */

.papyrus-fiber {
  background-image:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.04) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(0deg, rgba(90,58,30,0.07) 0 2px, transparent 2px 20px),
    radial-gradient(ellipse at 30% 20%, rgba(200,155,46,0.18), transparent 40%),
    radial-gradient(ellipse at 80% 70%, rgba(90,58,30,0.15), transparent 50%);
}

.burnt-edge {
  position: relative;
}

.burnt-edge::before{
  content:"";
  position:absolute;
  inset:-18px;
  background: radial-gradient(ellipse at center, transparent 70%, rgba(44,22,8,0.25) 82%, rgba(20,10,3,0.55) 100%);
  filter: blur(8px);
  pointer-events:none;
  z-index:-1;
}

.gold-text {
  background: linear-gradient(100deg, var(--gold-dark), var(--gold), var(--gold-bright), var(--gold), var(--gold-dark));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 1px 0 rgba(140,101,16,0.4)) drop-shadow(0 0 8px rgba(248,213,106,0.35));
}

.wax-seal {
  background: radial-gradient(circle at 35% 30%, #a42a2a, #7a1a1a 55%, #4a0f0f 85%);
  box-shadow: inset 0 3px 8px rgba(255,255,255,0.25), inset 0 -6px 12px rgba(0,0,0,0.6), 0 6px 18px rgba(0,0,0,0.5), 0 0 20px rgba(122,26,26,0.4);
}

.candle-flicker {
  animation: flicker 4.2s infinite alternate ease-in-out;
}

@keyframes flicker {
  0% {
    opacity:0.92;
    filter: brightness(1)
  }

  7% {
    opacity:0.88;
    filter: brightness(0.96)
  }

  15% {
    opacity:1;
    filter: brightness(1.06)
  }

  23% {
    opacity:0.9;
    filter: brightness(0.98)
  }

  35% {
    opacity:1;
  }

  60% {
    opacity:0.93;
  }

  80% {
    opacity:1;
    filter: brightness(1.08)
  }

  100% {
    opacity:0.96;
  }
}

.gold-dust {
  position:absolute;
  width:2px;
  height:2px;
  background: var(--gold-bright);
  border-radius:50%;
  box-shadow: 0 0 6px var(--gold-bright);
  animation: drift linear infinite;
  opacity:0.8;
}

@keyframes drift {
  from {
    transform: translateY(0) translateX(0)
  }

  to {
    transform: translateY(-120vh) translateX(20px)
  }
}

.wood-grain {
  background:
    linear-gradient(90deg, rgba(0,0,0,0.15), rgba(255,255,255,0.08), rgba(0,0,0,0.2)),
    repeating-linear-gradient(0deg, #3b2614 0 3px, #4a321d 3px 7px, #3b2614 7px 12px, #5a3d22 12px 15px);
}

.handwritten {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
}

.scrollbar-none::-webkit-scrollbar {
  display:none
}

.scrollbar-none {
