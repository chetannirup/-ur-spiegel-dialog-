Sehr geehrte Damen und Herren,
wie lernen junge Menschen, Regeln nicht nur zu befolgen, sondern sie zu verstehen, kritisch zu prüfen und verantwortungsvoll mitzugestalten?
Dazu haben wir ein erprobbares Modell entwickelt: „Wie werde ich erwachsen? – Ein offenes Curriculum für Selbstverantwortung, Kooperationsfähigkeit und Regelkompetenz“.
Das Konzept (acht Wochen, sieben Lernfelder + offene achte Dimension, vier beobachtbare Prüfsteine) ist als Einladung zur gemeinsamen Prüfung gedacht – nicht als fertiger Antrag auf ein neues Pflichtfach. Wir würden gerne in einem 30-minütigen Fachgespräch klären, ob ein kleiner Pilotversuch fachlich sinnvoll und organisatorisch möglich ist.
Anbei erhalten Sie den Konzeptentwurf (Langfassung) und eine einseitige Kurzfassung. Wir sind ausdrücklich offen für Kritik, fachliche Einwände und Anpassung.
Würden Sie uns einen Termin für ein erstes Gespräch ermöglichen?
Mit freundlichen Grüßen
Chetan Nirup – Poetische Denkwerkstatt
