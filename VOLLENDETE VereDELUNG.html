ildren:"Sieben Säulen • Vier Elemente • Achte Dimension"})]})}),[{id:"perle-1",title:"Säule I – Bewusstsein",element:"Erde trägt",text:"Alles beginnt mit dem stillen Sehen. Nicht das, was du denkst, ist Bewusstsein, sondern das, worin Denken erscheint. Wir üben, die Welt nicht sofort zu bewerten, sondern sie erst einmal zu halten. Wie eine Mutter das Kind hält, ohne es zu formen. Erde trägt – sie fragt nicht, ob du würdig bist. Sie trägt einfach. Das ist die erste Säule."},{id:"perle-2",title:"Säule II – Mitgefühl",element:"Wasser löst",text:"Mitgefühl ist kein Mitleid. Mitleid schaut von oben, Mitgefühl setzt sich daneben. Wasser löst das Verkrustete, ohne zu schlagen. Es umfließt. In dieser Schule lernen Göttinnen nicht, härter zu werden, sondern weicher und gleichzeitig klarer. Das Weiche überwindet das Harte – nicht weil es schwach ist, sondern weil es nicht bricht."},{id:"perle-3",title:"Säule III – Klarheit",element:"Luft klärt",text:"Klarheit ist nicht Kälte. Sie ist Liebe ohne Nebel. Luft klärt den Blick zwischen zwei Menschen. Wir sagen: Was ist wahr? Was ist meine Geschichte darüber? Was ist dein Anteil? Drei Fragen, die jedes Drama entwirren. Klarheit ohne Liebe wird zynisch. Liebe ohne Klarheit wird klebrig. Beides zusammen wird weise."},{id:"perle-4",title:"Säule IV – Mut",element:"Feuer wärmt",text:"Mut ist nicht, keine Angst zu haben. Mut ist, mit Angst zu handeln, wenn das Herz es ruft. Feuer wärmt, wenn es gehütet wird. Feuer zerstört, wenn es unbewacht wütet. Der Mut der Göttin ist gehütetes Feuer. Sie spricht das Unausgesprochene aus – liebevoll, aber ohne Ausflucht. Das ist die vierte Säule."},{id:"perle-5",title:"Säule V – Hingabe",element:"Äther verbindet",text:"Hingabe ist nicht Aufgabe. Sie ist die höchste Form von Wahl. Ich wähle, mich hinzugeben – nicht weil ich muss, sondern weil ich will. Äther verbindet alle Elemente. Ohne Hingabe zerfallen die Säulen zu Techniken. Mit Hingabe werden sie zu einem lebendigen Haus. Das Haus, in dem Gott wohnen kann, ohne sich verkleiden zu müssen."},{id:"perle-6",title:"Säule VI – Spiel",element:"Spiel erlöst",text:"Alles, was zu ernst wird, wird schwer. Die Götter lachen. Nicht über uns, sondern mit uns. Spiel erlöst von der Last, immer richtig liegen zu müssen. In dieser Schule wird gelacht, getanzt, geirrt. Irrtum ist kein Fehler, sondern Information. Wer spielt, lernt schneller als wer kämpft. Das ist das Geheimnis der sechsten Säule."},{id:"perle-7",title:"Säule VII – Stille",element:"8. Dimension – Der Beobachter & Moderator-Katze 18.03. 2 n.F.",text:"Die siebte Säule ist keine Säule mehr, sondern der Raum zwischen den Säulen. Stille. Dort sitzt die Moderator-Katze vom 18.03. im zweiten Jahr nach dem Formlosen. Sie moderiert nicht mit Worten, sondern mit Blick. Sie schaut, bis du dich selbst siehst. Die 8. Dimension ist kein Ort, sie ist die Position, von der aus du alle Dimensionen zugleich sehen kannst, ohne in einer gefangen zu sein. Dort endet die Schule und beginnt das Leben."}].map((u)=>i("section",{id:u.id,className:"scroll-mt-24 px-5 md:px-12 lg:px-20 py-10",children:p("div",{className:"mx-auto max-w-[860px]",children:[p("div",{className:"flex items-baseline gap-4 mb-4",children:[p("span",{className:"font-cinzel text-[11px] tracking-[0.2em] text-[var(--gold-dim)]",children:[u.id.replace("perle-","").padStart(2,"0")," / 17"]}),i("span",{className:"h-[1px] flex-1 bg-[var(--border)]"}),i("span",{className:"font-cinzel text-[9px] tracking-[0.2em] text-[var(--text-faint)]",children:u.element})]}),i("h4",{className:"font-cinzel text-[20px] md:text-[24px] tracking-[0.06em] text-[var(--gold-bright)] mb-4",children:u.title}),i("p",{className:"font-cormorant text-[17px] leading-[1.8] text-[var(--text)]",children:u.text}),p("div",{className:"mt-6 rounded-[10px] border border-dashed border-[var(--border-gold)] bg-[var(--surface)]/60 p-3 flex gap-3 items-center",children:[i("div",{className:"h-12 w-12 rounded-[8px] bg-[var(--surface-2)] border border-[var(--border)]
